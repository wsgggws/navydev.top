log_format navydev_performance '$time_iso8601 reason=$arg_reason ttfb=$arg_ttfb '
    'fcp=$arg_fcp lcp=$arg_lcp cls=$arg_cls inp=$arg_inp '
    'long_tasks=$arg_ltc/$arg_ltt/$arg_ltm fps=$arg_fps quality=$arg_quality '
    'viewport=$arg_viewport dpr=$arg_dpr network=$arg_network';

server {
    listen 80;
    server_name navydev.top www.navydev.top;

    return 301 https://navydev.top$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name navydev.top www.navydev.top;

    # SSL certificate paths managed by certbot
    ssl_certificate /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    
    # Include certbot's recommended SSL configuration
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static files configuration
    root /var/www/navydev.top;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anonymous Real User Monitoring. Only numeric performance and rendering
    # health fields are logged; page content and user identifiers are omitted.
    location = /__perf.gif {
        access_log /var/log/nginx/navydev-performance.log navydev_performance;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location = /nghh {
        return 301 /nghh/;
    }

    # Random student picker
    location /nghh/ {
        alias /var/www/navydev.top/nghh/;
    }

    # logo with longer cache
    location ~* ^/assets/images/me\.(ico|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
